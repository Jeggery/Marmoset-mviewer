name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag matching Cargo.toml (e.g. v3.0.1)"
        required: true
        default: "v3.0.1"
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Validate tag, package version and release notes
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 scripts/release_metadata.py --tag "$RELEASE_TAG"
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test release metadata validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  build:
    name: Release build (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            archive_name: mviewer-${{ needs.prepare.outputs.tag }}-linux-x64.tar.gz
            bin_name: mviewer
          - os: windows-latest
            label: windows-x64
            archive_name: mviewer-${{ needs.prepare.outputs.tag }}-windows-x64.zip
            bin_name: mviewer.exe
          - os: macos-latest
            label: macos-arm64
            archive_name: mviewer-${{ needs.prepare.outputs.tag }}-macos-arm64.tar.gz
            bin_name: mviewer
          - os: macos-15-intel
            label: macos-x64
            archive_name: mviewer-${{ needs.prepare.outputs.tag }}-macos-x64.tar.gz
            bin_name: mviewer
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked --lib

      - name: Build release binary
        run: cargo build --release --locked

      - name: Generate release icons
        run: cargo run --release --locked --example generate_icons -- dist/generated-icons

      - name: Prepare package directory
        shell: bash
        run: |
          mkdir -p dist/mviewer
          cp README.md dist/mviewer/README.md
          cp CHANGELOG.md dist/mviewer/CHANGELOG.md
          cp LICENSE 2>/dev/null dist/mviewer/LICENSE || true
          cp target/release/${{ matrix.bin_name }} dist/mviewer/${{ matrix.bin_name }}
          mkdir -p dist/mviewer/icons
          cp dist/generated-icons/mviewer-256.png dist/mviewer/icons/mviewer.png

      - name: Add Linux desktop launcher
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/mviewer/share/applications
          cp packaging/linux/mviewer.desktop dist/mviewer/share/applications/mviewer.desktop

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_DIR="dist/mviewer/mviewer.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp target/release/mviewer "$APP_DIR/Contents/MacOS/mviewer"
          chmod +x "$APP_DIR/Contents/MacOS/mviewer"
          cat > "$APP_DIR/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>English</string>
            <key>CFBundleExecutable</key>
            <string>mviewer</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>io.github.jeggery.marmoset-mviewer</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>mviewer</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ needs.prepare.outputs.version }}</string>
            <key>CFBundleVersion</key>
            <string>${{ github.run_number }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
          </dict>
          </plist>
          mkdir -p icon.iconset
          for size in 16 32 128 256 512; do
            cp "dist/generated-icons/mviewer-${size}.png" "icon.iconset/icon_${size}x${size}.png"
            cp "dist/generated-icons/mviewer-$((size * 2)).png" "icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns icon.iconset -o "$APP_DIR/Contents/Resources/AppIcon.icns"
          rm -rf icon.iconset

      - name: Archive release bundle (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf dist/${{ matrix.archive_name }} -C dist mviewer

      - name: Archive release bundle (zip)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path dist\mviewer -DestinationPath dist\${{ matrix.archive_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.label }}
          path: dist/${{ matrix.archive_name }}

      - name: Prepare standalone Windows executable
        if: runner.os == 'Windows'
        shell: powershell
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: Copy-Item -LiteralPath target\release\mviewer.exe -Destination "dist\mviewer-${env:RELEASE_TAG}-windows-x64.exe"

      - name: Upload standalone Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64-exe
          path: dist/mviewer-${{ needs.prepare.outputs.tag }}-windows-x64.exe

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 scripts/release_metadata.py --tag "$RELEASE_TAG" --notes-file release-notes.md

      - name: Download artifacts with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release-artifacts
          gh run download ${{ github.run_id }} --dir release-artifacts

      - name: Publish release assets with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Marmoset-mviewer $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --notes-file release-notes.md
          find release-artifacts -type f -print0 | xargs -0 gh release upload "$RELEASE_TAG" --clobber
