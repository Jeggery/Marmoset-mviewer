[package]
name = "mviewer"
version = "3.0.1"
edition = "2024"
description = "Marmoset .mview viewer and glTF/GLB exporter, maintained by the Jeggery fork"
repository = "https://github.com/Jeggery/Marmoset-mviewer"
homepage = "https://Jeggery.github.io/Marmoset-mviewer/"
readme = "README.md"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
http = "1.4"
image = { version = "0.25", default-features = true, features = ["jpeg", "png"] }
myth-gltf-json = { version = "1.4.2", features = ["names", "KHR_lights_punctual"] }
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
tao = "0.35.0"
tiny_http = "0.12"
wry = "0.55.0"

[build-dependencies]
ico = "0.4"
image = { version = "0.25", default-features = true, features = ["png", "webp"] }
winresource = "0.1"
